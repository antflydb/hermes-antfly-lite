name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  packages:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: darwin-arm64
          - runner: ubuntu-24.04
            target: linux-amd64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.2
          cache: true
      - name: Fetch pinned Antfly Lite native library
        run: scripts/fetch-antfly-native.sh "${{ matrix.target }}"
      - name: Verify tag matches plugin version
        run: test "$GITHUB_REF_NAME" = "v$(jq -r .version plugin.json)"
      - name: Build and qualify package
        env:
          ANTFLY_NATIVE_LIB_DIR: ${{ github.workspace }}/.antfly-native/lib
        run: scripts/ci-release.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: antfly-hermes-lite-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error

  publish:
    needs: packages
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: antfly-hermes-lite-*
          path: release-assets
          merge-multiple: true
      - name: Verify checksums
        working-directory: release-assets
        run: |
          for checksum in *.sha256; do
            sha256sum --check "$checksum"
          done
      - name: Create immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release-assets/* --verify-tag --generate-notes
